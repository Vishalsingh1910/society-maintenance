services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: societymaintenance
      POSTGRES_PASSWORD: "zCXV0UWtLGRBHu0vGgGdRdiMgJ_5eHe9"
    volumes:
      - societymaintenance_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "0g_rPLR0IfOeg6p-EpybHnsgmNq0Yg0F"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: societymaintenance_test
      POSTGRES_PASSWORD: "59c5jTw7WPQu1kwpOvOfBuiKYAvSJDJ-"
    volumes:
      - societymaintenance_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "xD2nsTKPTpsyBEEVTqxg6L3H7MC_PNB0"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  societymaintenance_data:
  societymaintenance_test_data:
